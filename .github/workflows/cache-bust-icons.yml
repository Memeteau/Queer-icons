name: Restore original Martyrologie icon

on:
  push:
    paths:
      - '.github/workflows/cache-bust-icons.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore-martyrologie:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore validated original icon and bump cache
        run: |
          git show 73473ada8b30cfbf92af0207a25f69e9f184583b:icons/martyrologie.svg > icons/martyrologie.svg
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          import re
          s, n = re.subn(r'icons/martyrologie\.svg\?v=[^"\']+', 'icons/martyrologie.svg?v=20260831-7', s, count=1)
          if n != 1:
              raise SystemExit('Could not update Martyrologie URL')
          p.write_text(s)
          PY
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add icons/martyrologie.svg index.html
          git diff --cached --quiet && exit 0
          git commit -m "Restore original Martyrologie icon"
          git push
