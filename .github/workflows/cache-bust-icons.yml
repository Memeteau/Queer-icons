name: Cache-bust Martyrologie icon URL

on:
  push:
    paths:
      - '.github/workflows/cache-bust-icons.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-icon-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump Martyrologie cache version
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          old = 'icons/martyrologie.svg?v=20260831-5'
          new = 'icons/martyrologie.svg?v=20260831-6'
          if old not in s:
              raise SystemExit(f'Missing expected string: {old}')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Force refresh of Martyrologie icon"
          git push
